<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>偶像資料庫</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2228; --muted: #6b7380; --line: #e3e6ea;
    --accent: #e0457b; --accent-soft: #fde8f0; --bar: #f2a3c0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --panel: #1d2026; --text: #e8eaed; --muted: #9aa1ab; --line: #2e323a;
            --accent: #ff6fa3; --accent-soft: #3a2230; --bar: #a5476c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h1 span { color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, button, textarea { font: inherit; color: inherit; background: var(--panel);
         border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  input[type=search] { flex: 1 1 260px; min-width: 0; }
  aside input { min-width: 0; width: 100%; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { display: grid; grid-template-columns: 260px 1fr; gap: 16px; max-width: 1200px; margin: 0 auto; padding: 16px; }
  aside section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  aside h2 { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 10px; font-size: 13px; cursor: pointer; border: 0; }
  .chip.on { background: var(--accent); color: #fff; }
  .chip .x { margin-left: 4px; opacity: .6; }
  .months { max-height: 360px; overflow: auto; font-size: 12px; }
  .month { display: grid; grid-template-columns: 58px 1fr 34px; gap: 6px; align-items: center; cursor: pointer; padding: 1px 0; }
  .month:hover { color: var(--accent); }
  .month .bar { height: 8px; background: var(--bar); border-radius: 4px; }
  .month .n { text-align: right; color: var(--muted); }
  .summary { color: var(--muted); margin: 0 0 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .meta b { color: var(--text); }
  .meta a { color: var(--muted); }
  .text { white-space: pre-wrap; word-break: break-word; margin: 6px 0; }
  .text a { color: var(--accent); }
  mark { background: #ffe58a; color: #000; border-radius: 3px; }
  .media { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; margin: 6px 0; }
  .media img, .media video { width: 100%; border-radius: 8px; max-height: 260px; object-fit: cover; background: var(--line); cursor: zoom-in; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .tools input { padding: 2px 8px; font-size: 13px; width: 120px; }
  .note { font-size: 13px; background: var(--accent-soft); border-radius: 8px; padding: 4px 8px; margin-top: 6px; white-space: pre-wrap; }
  .linkbtn { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 0 4px; }
  .linkbtn:hover { color: var(--accent); }
  #more { width: 100%; margin: 8px 0 40px; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 10; }
  #lightbox img { max-width: 95vw; max-height: 95vh; }
  .help { font-size: 12px; color: var(--muted); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { order: 2; } }
</style>
</head>
<body>
<header>
  <h1>⭐ <span>偶像資料庫</span></h1>
  <div class="row">
    <input type="search" id="q" placeholder="搜尋關鍵字…（空白 = 且、A|B = 或、-字 = 排除、&quot;片語&quot;）">
    <input type="date" id="from" title="起始日期">
    <span>～</span>
    <input type="date" id="to" title="結束日期">
    <select id="order"><option value="desc">新 → 舊</option><option value="asc">舊 → 新</option></select>
    <label><input type="checkbox" id="media"> 只看有圖</label>
    <button id="reset">清除條件</button>
  </div>
</header>
<main>
  <aside>
    <section>
      <h2>＋ 用網址加入貼文</h2>
      <div class="row">
        <input id="addUrl" placeholder="https://x.com/…/status/…" style="flex:1 1 100%">
        <input id="addTags" placeholder="標籤（選填）" style="flex:1;width:auto">
        <button class="primary" id="addBtn">加入</button>
      </div>
      <div class="help" id="addMsg"></div>
    </section>
    <section><h2>標籤</h2><div class="chips" id="tags"></div></section>
    <section><h2>帳號</h2><div class="chips" id="authors"></div></section>
    <section><h2>時間軸（點一下篩選該月）</h2><div class="months" id="months"></div></section>
  </aside>
  <div>
    <p class="summary" id="summary"></p>
    <div id="list"></div>
    <button id="more" hidden>載入更多</button>
  </div>
</main>
<div id="lightbox"><img alt=""></div>
<script>
const $ = (s) => document.querySelector(s);
const state = { tag: "", author: "", offset: 0, total: 0 };
const PAGE = 50;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function highlight(text, q) {
  let out = esc(text).replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  const terms = q.match(/"[^"]+"|\S+/g) || [];
  for (let t of terms) {
    if (t.startsWith("-")) continue;
    for (const alt of t.replace(/"/g, "").split("|")) {
      if (!alt) continue;
      const re = new RegExp("(" + esc(alt).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![^<]*>)", "gi");
      out = out.replace(re, "<mark>$1</mark>");
    }
  }
  return out;
}

function params() {
  const p = new URLSearchParams({ q: $("#q").value, from: $("#from").value, to: $("#to").value,
    order: $("#order").value, tag: state.tag, author: state.author, limit: PAGE, offset: state.offset });
  if ($("#media").checked) p.set("media", "1");
  return p;
}

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

function renderCard(t) {
  const q = $("#q").value;
  const media = t.media.map((m) => {
    const src = m.local_url || m.url;
    if (m.type === "unknown") return `<a class="help" href="${esc(t.url)}" target="_blank">📷 含圖片／影片，點此看原文</a>`;
    if (/\.mp4/.test(src) || m.type === "video" || m.type === "animated_gif")
      return /\.mp4/.test(src) ? `<video src="${esc(src)}" controls preload="metadata"></video>` : `<a href="${esc(t.url)}" target="_blank">🎬 影片</a>`;
    return `<img loading="lazy" src="${esc(src)}" alt="" data-full="${esc(src)}">`;
  }).join("");
  const tags = t.tags.map((g) => `<span class="chip">#${esc(g)}<span class="x" data-untag="${esc(g)}" title="移除">×</span></span>`).join("");
  const date = t.created_at ? t.created_at.slice(0, 16).replace("T", " ") : "日期不明";
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div class="meta"><b>${esc(t.author_name || "")}</b>${t.author_username ? `<span>@${esc(t.author_username)}</span>` : ""}
      <a href="${esc(t.url)}" target="_blank" rel="noopener">${date} UTC ↗</a>
      ${t.likes != null ? `<span>♥ ${t.likes}</span>` : ""}${t.retweets != null ? `<span>⟲ ${t.retweets}</span>` : ""}
      <span>來源：${esc(t.source)}</span></div>
    <div class="text">${highlight(t.text, q)}</div>
    ${media ? `<div class="media">${media}</div>` : ""}
    ${t.note ? `<div class="note">📝 ${esc(t.note)}</div>` : ""}
    <div class="tools">${tags}
      <input placeholder="+ 標籤，Enter" data-addtag>
      <button class="linkbtn" data-note>📝 備註</button>
      <button class="linkbtn" data-copy>🔗 複製網址</button>
      <button class="linkbtn" data-del>🗑 刪除</button>
    </div>`;
  el.querySelector("[data-addtag]").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter" || e.isComposing || !e.target.value.trim()) return;
    for (const tag of e.target.value.split(/[\s,，]+/).filter(Boolean)) await api("/api/tag", { id: t.id, tag });
    t.tags = [...new Set([...t.tags, ...e.target.value.split(/[\s,，]+/).filter(Boolean)])].sort();
    el.replaceWith(renderCard(t)); loadStats();
  });
  el.querySelectorAll("[data-untag]").forEach((x) => x.addEventListener("click", async () => {
    await api("/api/untag", { id: t.id, tag: x.dataset.untag });
    t.tags = t.tags.filter((g) => g !== x.dataset.untag); el.replaceWith(renderCard(t)); loadStats();
  }));
  el.querySelector("[data-note]").addEventListener("click", async () => {
    const note = prompt("備註：", t.note || ""); if (note === null) return;
    await api("/api/note", { id: t.id, note }); t.note = note; el.replaceWith(renderCard(t));
  });
  el.querySelector("[data-copy]").addEventListener("click", () => navigator.clipboard?.writeText(t.url));
  el.querySelector("[data-del]").addEventListener("click", async () => {
    if (!confirm("確定要從資料庫刪除這則貼文？")) return;
    await api("/api/delete", { id: t.id }); el.remove(); loadStats();
  });
  el.querySelectorAll("img[data-full]").forEach((img) => img.addEventListener("click", () => {
    $("#lightbox img").src = img.dataset.full; $("#lightbox").style.display = "flex";
  }));
  return el;
}

async function search(append = false) {
  if (!append) state.offset = 0;
  const j = await api("/api/search?" + params());
  state.total = j.total;
  if (!append) $("#list").innerHTML = "";
  j.items.forEach((t) => $("#list").appendChild(renderCard(t)));
  state.offset += j.items.length;
  const filters = [state.tag && "#" + state.tag, state.author && "@" + state.author].filter(Boolean).join(" ");
  $("#summary").textContent = `共 ${j.total} 則${filters ? "（" + filters + "）" : ""}`;
  $("#more").hidden = state.offset >= j.total;
}

async function loadStats() {
  const s = await api("/api/stats");
  $("#tags").innerHTML = s.tags.map((t) => `<button class="chip ${state.tag === t.tag ? "on" : ""}" data-tag="${esc(t.tag)}">#${esc(t.tag)} ${t.n}</button>`).join("") || '<span class="help">尚無標籤</span>';
  $("#authors").innerHTML = s.authors.map((a) => `<button class="chip ${state.author === a.username ? "on" : ""}" data-author="${esc(a.username)}" title="${esc(a.name)}">@${esc(a.username)} ${a.n}</button>`).join("") || '<span class="help">—</span>';
  const peak = Math.max(1, ...s.months.map((m) => m.n));
  $("#months").innerHTML = s.months.slice().reverse().map((m) =>
    `<div class="month" data-month="${m.month}"><span>${m.month}</span><div class="bar" style="width:${Math.max(4, m.n / peak * 100)}%"></div><span class="n">${m.n}</span></div>`).join("");
  document.querySelectorAll("[data-tag]").forEach((b) => b.onclick = () => { state.tag = state.tag === b.dataset.tag ? "" : b.dataset.tag; loadStats(); search(); });
  document.querySelectorAll("[data-author]").forEach((b) => b.onclick = () => { state.author = state.author === b.dataset.author ? "" : b.dataset.author; loadStats(); search(); });
  document.querySelectorAll("[data-month]").forEach((b) => b.onclick = () => {
    const [y, m] = b.dataset.month.split("-").map(Number);
    $("#from").value = `${b.dataset.month}-01`;
    $("#to").value = new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
    search();
  });
}

let timer;
$("#q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => search(), 250); });
["#from", "#to", "#order", "#media"].forEach((s) => $(s).addEventListener("change", () => search()));
$("#more").addEventListener("click", () => search(true));
$("#reset").addEventListener("click", () => {
  $("#q").value = $("#from").value = $("#to").value = ""; $("#media").checked = false;
  state.tag = state.author = ""; loadStats(); search();
});
$("#lightbox").addEventListener("click", () => $("#lightbox").style.display = "none");
$("#addBtn").addEventListener("click", async () => {
  const url = $("#addUrl").value.trim(); if (!url) return;
  $("#addMsg").textContent = "讀取中…";
  try {
    await api("/api/add", { url, tags: $("#addTags").value });
    $("#addMsg").textContent = "✓ 已加入"; $("#addUrl").value = "";
    loadStats(); search();
  } catch (e) { $("#addMsg").textContent = "✗ " + e.message; }
});
loadStats(); search();
</script>
</body>
</html>
